# Fast training settings for first run on RTX 4060 Ti (8GB VRAM)
# Reduced epochs, smaller batches, 5-year history
# Estimated training time: ~2-4 hours

project:
  name: "Alpha Signal Discovery Engine"
  version: "1.0.0"
  root_dir: "C:/src/Qunat_trading"

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "saved_models"
  logs: "logs"
  results: "results"
  indicators: "saved_indicators"

# Points to the matching fast model config
model_config_path: "config/model_config_fast.yaml"

gpu:
  device: "cuda"
  mixed_precision: true
  gradient_checkpointing: true
  memory_fraction: 0.85  # Safety margin for 8GB VRAM
  compile_model: false   # Disable torch.compile for first run stability

training:
  default_epochs: 30
  early_stopping_patience: 15
  gradient_accumulation_steps: 1  # No accumulation - large batch already
  physical_batch_size: 256        # Increased from 32 (mixed precision fits 8GB)
  effective_batch_size: 256
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: "cosine_warmup"
  warmup_ratio: 0.1
  seed: 42
  num_workers: 0   # 0 for Windows shared memory compatibility
  pin_memory: true
  max_tickers: 350  # KOSPI200 + KOSDAQ150 + NASDAQ100 미만 (유동성 높은 종목 집중)
  kospi200_only: true    # KOSPI200 구성종목만 사용 (노이즈 제거, 유동성 확보)
  include_kosdaq: true   # 코스닥 매매 대상 포함
  kosdaq150_only: true   # KOSDAQ150 구성종목만 사용 (바이오/IT 집중, 유동성 확보)

data:
  markets:
    - "KOSPI"
    - "KOSDAQ"
    - "NASDAQ"
  history_years: 5       # 5 years - recent data is more predictive for short-term test period
  min_history_days: 250  # ~1 year minimum
  filter_unknown_sectors: true  # Remove tickers with unknown sector classification
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  chunk_size: 10000
  sequence_length: 60
  cross_sectional_target: true  # 상대 수익률 예측 (시장 대비 outperformance)

backtest:
  initial_capital: 100_000_000
  commission_rate: 0.0002    # 실제 수준: 국내 0.015~0.05% → 평균 0.02% 사용
  slippage_rate: 0.003       # 기본 슬리피지 (KOSPI 대형주 기준 0.3%)
  # 시장별 슬리피지 차등 (백테스트 엔진에서 사용)
  slippage_by_market:
    KOSPI:  0.003    # KOSPI200 대형주: 0.3%
    KOSDAQ: 0.005    # KOSDAQ150: 0.5% (스프레드 넓음, 유동성 낮음)
    NASDAQ: 0.001    # 미국 대형주: 0.1% (유동성 풍부)
  max_position_pct: 0.30   # live_config max_sector_weight(0.30)와 일치 — 기존 0.1은 11섹터에서 차별화 불가
  rebalance_frequency: "weekly"
  # Phase 21: EW blending 제거 → cross-sectional rank (dollar-neutral)
  # alpha_blend는 더 이상 사용하지 않음 (signal.py에서 rank normalize)
  # alpha_blend: 0.4  # DEPRECATED — 모델 신호 직접 사용
  rebalance_threshold: 0.03  # 매수 3% drift 시 리밸런싱 (매도는 2%로 별도 적용)
  use_flow_data: true  # 외국인/기관 수급 데이터 활용

logging:
  level: "INFO"
  console: true
  file: true
  tensorboard: true
